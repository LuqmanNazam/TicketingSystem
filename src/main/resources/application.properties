spring.application.name=tickets
example.message=Hello World
server.port=8081

# --- Spring Data JPA / H2 settings ---

# Use an in-memory H2 database for this learning project. The database will be created when the application starts, and destroyed when it stops.
spring.datasource.url=jdbc:h2:mem:tickets

# Use the default H2 username and password. (H2 doesn't require a password, but Spring Boot does.)
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the database tables from our @Entity classes on startup
# (and drop them on shutdown). "create-drop" is fine for a learning project.
spring.jpa.hibernate.ddl-auto=create-drop

# Run data.sql AFTER Hibernate has created the tables (otherwise the inserts
# would fail because the tables would not exist yet).
spring.jpa.defer-datasource-initialization=true

# Print the SQL Hibernate runs, so you can see what Spring Data does for you.
spring.jpa.show-sql=true

# Enable the H2 web console at http://localhost:8081/h2-console
# (use JDBC URL jdbc:h2:mem:testdb, user "sa", empty password).
spring.h2.console.enabled=true
